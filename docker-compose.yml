services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8789
      DATABASE_URL: postgres://studiodesk:studiodesk@db:5432/studiodesk
      PRIVATE_MODE: "false"
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - studiodesk-data:/app/data
      - studiodesk-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studiodesk
      POSTGRES_PASSWORD: studiodesk
      POSTGRES_DB: studiodesk
    volumes:
      - studiodesk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiodesk -d studiodesk"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  studiodesk-data:
  studiodesk-uploads:
  studiodesk-db:
