<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">StudioDesk campaign workspace flow</title>
  <desc id="desc">Campaign facts connect to content assets, which go through review and report export.</desc>
  <rect width="1400" height="520" fill="#f7f8f6"/>
  <text x="70" y="70" fill="#173b3e" font-family="Arial, sans-serif" font-size="32" font-weight="700">StudioDesk · one change, one review queue</text>
  <text x="70" y="105" fill="#64807e" font-family="Arial, sans-serif" font-size="16">Personal open-source demo · Synthetic campaign · No platform connections</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="180" width="220" height="170" rx="18" fill="#e4f5ed" stroke="#63b997" stroke-width="2"/>
    <text x="98" y="220" fill="#1d8067" font-size="14" font-weight="700">CAMPAIGN FACTS</text>
    <text x="98" y="255" fill="#173b3e" font-size="18" font-weight="700">Venue · Price · Date</text>
    <text x="98" y="285" fill="#5b7770" font-size="14">Versioned values</text>
    <text x="98" y="312" fill="#5b7770" font-size="14">with change history</text>
    <rect x="385" y="150" width="280" height="230" rx="18" fill="#ffffff" stroke="#cfded8" stroke-width="2"/>
    <text x="420" y="192" fill="#1d8067" font-size="14" font-weight="700">DEPENDENCY MAP</text>
    <text x="420" y="230" fill="#173b3e" font-size="18" font-weight="700">Connected assets</text>
    <text x="420" y="265" fill="#5b7770" font-size="14">Poster · Caption · Story</text>
    <text x="420" y="292" fill="#5b7770" font-size="14">Ticket page · Reminder</text>
    <text x="420" y="335" fill="#c27828" font-size="14" font-weight="700">Only affected items reset</text>
    <rect x="760" y="180" width="230" height="170" rx="18" fill="#153b40"/>
    <text x="798" y="220" fill="#8fe3bf" font-size="14" font-weight="700">HUMAN REVIEW</text>
    <text x="798" y="255" fill="#ffffff" font-size="18" font-weight="700">Revise → approve</text>
    <text x="798" y="285" fill="#b1c7c0" font-size="14">Approval belongs to</text>
    <text x="798" y="312" fill="#b1c7c0" font-size="14">a specific version</text>
    <rect x="1085" y="180" width="245" height="170" rx="18" fill="#ffffff" stroke="#cfded8" stroke-width="2"/>
    <text x="1120" y="220" fill="#1d8067" font-size="14" font-weight="700">HANDOFF</text>
    <text x="1120" y="255" fill="#173b3e" font-size="18" font-weight="700">Report + checklist</text>
    <text x="1120" y="285" fill="#5b7770" font-size="14">CSV quality checks</text>
    <text x="1120" y="312" fill="#5b7770" font-size="14">Markdown / JSON export</text>
  </g>
  <g stroke="#42ae87" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M290 265H385"/><path d="M665 265H760"/><path d="M990 265H1085"/>
  </g>
  <g fill="#42ae87"><circle cx="290" cy="265" r="7"/><circle cx="385" cy="265" r="7"/><circle cx="665" cy="265" r="7"/><circle cx="760" cy="265" r="7"/><circle cx="990" cy="265" r="7"/><circle cx="1085" cy="265" r="7"/></g>
  <text x="70" y="455" fill="#859590" font-family="Arial, sans-serif" font-size="14">The sample campaign is fictional. StudioDesk does not verify whether a corrected post was published on an external platform.</text>
</svg>
